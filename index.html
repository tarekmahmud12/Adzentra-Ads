<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adzentra Ads - Publisher Dashboard</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1 class="logo">Adzentra<span>Ads</span></h1>
            <div id="user-mini-profile" style="display: none;">
                <span id="top-balance" class="balance-badge">$0.0000</span>
            </div>
        </header>

        <main id="main-content">
            <div id="loading-screen" class="status-box">
                <div class="spinner"></div>
                <p style="margin-top: 15px;">Securely Signing In...</p>
            </div>

            <div id="welcome-screen" class="status-box" style="display: none;">
                <div class="profile-card">
                    <img id="user-photo" src="assets/default-avatar.png" alt="Profile">
                    <h2>Hello, <span id="user-name">Publisher</span>!</h2>
                    <p class="verified-text">Verified Partner ✅</p>
                </div>
                <button onclick="showSection('dashboard')" class="btn primary-btn">Open Dashboard</button>
            </div>

            <div id="dashboard-section" style="display: none; padding-bottom: 100px;">
                <div class="main-balance-card">
                    <h4>Available Balance</h4>
                    <div class="balance-amount" id="balance-val">$0.0000</div>
                    <p class="refresh-text">Real-time Analytics</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h5>Today Clicks</h5>
                        <span class="value blue" id="today-clicks">0</span>
                    </div>
                    <div class="stat-card">
                        <h5>Today Earnings</h5>
                        <span class="value green" id="today-earning">$0.0000</span>
                    </div>
                    <div class="stat-card">
                        <h5>Average CPM</h5>
                        <span class="value" id="cpm-val">$1.50</span>
                    </div>
                    <div class="stat-card">
                        <h5>Ref. Bonus</h5>
                        <span class="value yellow" id="ref-earning">$0.00</span>
                    </div>
                </div>

                <div class="action-box">
                    <h4>Create Smart Link</h4>
                    <input type="url" id="target-url" placeholder="Enter Destination URL">
                    <button class="btn-action" onclick="handleLinkCreation()">Generate Smart Link</button>
                    <div id="result-area" style="display:none; margin-top:15px;">
                        <input type="text" id="final-link" readonly>
                        <button class="btn-action copy-btn" onclick="copyToClipboard('final-link')">Copy Link</button>
                    </div>
                </div>

                <div class="action-box referral-box">
                    <h4>Your Referral Link</h4>
                    <input type="text" id="ref-link" readonly>
                    <button class="btn-action ref-btn" onclick="copyToClipboard('ref-link')">Copy & Invite (5%)</button>
                </div>
            </div>
        </main>

        <nav id="bottom-nav" class="bottom-nav" style="display: none;">
            <a href="javascript:void(0)" onclick="showSection('dashboard')" class="nav-item active">
                <i class="fa-solid fa-house"></i>Home
            </a>
            <a href="withdraw.html" class="nav-item"><i class="fa-solid fa-wallet"></i>Withdraw</a>
            <a href="analytics.html" class="nav-item"><i class="fa-solid fa-chart-line"></i>Stats</a>
        </nav>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="main.js"></script>

</body>
</html>
